<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroPress Timer settings</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 24px 20px; font: 17px/1.4 -apple-system, system-ui, sans-serif; background: #111; color: #eee; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #333; }
  .row label { flex: 1; }
  input[type=checkbox] { width: 24px; height: 24px; }
  input[type=range] { width: 55%; }
  select { font-size: 16px; padding: 6px 8px; }
  .chime-row select { flex: 1; margin-right: 10px; }
  .play { border: 0; border-radius: 8px; background: #333; color: #ffaa00; font-size: 18px; width: 44px; height: 40px; }
  .play:active { background: #444; }
  .value { min-width: 3ch; text-align: right; color: #ffaa00; font-variant-numeric: tabular-nums; }
  button { margin-top: 28px; width: 100%; padding: 14px; font-size: 18px; border: 0; border-radius: 10px; background: #ffaa00; color: #111; font-weight: 600; }
  .hint { color: #999; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<h1>AeroPress Timer</h1>
<div class="row"><label for="chime">Chime at 0:00</label><input id="chime" type="checkbox"></div>
<div class="row chime-row"><label for="melody">Chime</label><select id="melody"><option value="single">Single tone</option><option value="triple">Three notes</option><option value="teapot">Teapot</option></select><button id="play" class="play" type="button" aria-label="Preview chime">&#9654;</button></div>
<div class="row"><label for="vibe">Vibrate at 0:00</label><input id="vibe" type="checkbox"></div>
<div class="row"><label for="touch">Tap screen to advance</label><input id="touch" type="checkbox"></div>
<div class="row"><label for="volume">Chime volume</label><input id="volume" type="range" min="0" max="100" step="5"><span class="value" id="volumeValue"></span></div>
<button id="save">Save</button>
<p class="hint">The play button previews the tune on this phone; the watch plays it for real when you save. The vibration follows the rhythm of the chosen chime. The chime stays silent while the watch is muted or in Quiet Time, whatever this says.</p>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var returnTo = params.get("return_to") || "pebblejs://close#";
  var settings = { chime: true, vibe: true, volume: 40, touch: true, melody: "teapot" };
  try {
    var given = JSON.parse(params.get("settings"));
    if (given) settings = Object.assign(settings, given);
  } catch (e) {}

  var chime = document.getElementById("chime");
  var vibe = document.getElementById("vibe");
  var touch = document.getElementById("touch");
  var melody = document.getElementById("melody");
  var play = document.getElementById("play");

  // Mirror of MELODIES in src/embeddedjs/main.ts: [midi, ms] per note.
  var MELODIES = {
    single: [[79, 500]],
    triple: [[72, 120], [76, 120], [79, 120]],
    teapot: [[72, 280], [74, 280], [76, 140], [77, 140], [79, 280], [84, 420]]
  };
  var audio = null;
  function preview(name) {
    var notes = MELODIES[name] || MELODIES.teapot;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      var t = audio.currentTime + 0.02;
      var vol = Math.max(0, Math.min(100, Number(volume.value))) / 100;
      notes.forEach(function (n) {
        var freq = 440 * Math.pow(2, (n[0] - 69) / 12);
        var dur = n[1] / 1000;
        var osc = audio.createOscillator();
        var gain = audio.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, 0.25 * vol), t + 0.01);
        gain.gain.setValueAtTime(Math.max(0.0001, 0.25 * vol), t + dur - 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain).connect(audio.destination);
        osc.start(t);
        osc.stop(t + dur);
        t += dur;
      });
    } catch (e) {}
  }
  play.addEventListener("click", function () { preview(melody.value); });
  var volume = document.getElementById("volume");
  var volumeValue = document.getElementById("volumeValue");

  chime.checked = !!settings.chime;
  vibe.checked = !!settings.vibe;
  touch.checked = settings.touch !== false;
  melody.value = settings.melody;
  if (!melody.value) melody.value = "teapot";
  volume.value = settings.volume;
  volumeValue.textContent = volume.value;
  volume.addEventListener("input", function () { volumeValue.textContent = volume.value; });

  document.getElementById("save").addEventListener("click", function () {
    var out = { chime: chime.checked, vibe: vibe.checked, volume: Number(volume.value), touch: touch.checked, melody: melody.value };
    location.href = returnTo + encodeURIComponent(JSON.stringify(out));
  });
})();
</script>
</body>
</html>
